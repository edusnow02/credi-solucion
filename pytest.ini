# Configuración de pytest (el programa que corre los tests).
[pytest]
# Carpetas que se agregan al "camino de búsqueda" de Python:
#   backend → para importar "creditos", "nucleo", etc. igual que Django.
#   .       → para importar "datos_sinteticos".
pythonpath = backend .
# Dónde buscar tests.
testpaths = backend datos_sinteticos
# Configuración de Django para los tests (claves de prueba, sin .env).
DJANGO_SETTINGS_MODULE = servidor.settings_test
